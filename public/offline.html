<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>우리 동네 카페 지도</title>
    <style>
      html, body {
        margin: 0;
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #ffffff;
        color: #0f172a;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        text-align: center;
      }
      main {
        padding: 24px;
        max-width: 320px;
      }
      h1 {
        font-size: 1rem;
        margin: 0 0 8px;
      }
      p {
        font-size: 0.875rem;
        color: #64748b;
        margin: 0;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>인터넷 연결이 필요합니다</h1>
      <p>지도, 로그인, 소감 저장은 온라인 상태에서만 이용할 수 있어요. 연결을 확인한 뒤 다시 시도해주세요.</p>
    </main>
  </body>
</html>
